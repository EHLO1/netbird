#-[ PROJECT NAME
name: netbird
# https://netbird.io
# https://github.com/netbirdio/netbird

#-[ ANCHORS
x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  # Postgres - SQL Database
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG}
    container_name: postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging
    networks:
      - netbird-backend
    restart: unless-stopped
    volumes:
      - postgres.data:/var/lib/postgresql/data

  caddy:
    build:
      context: ./config/caddy
      dockerfile: ./Dockerfile
    container_name: caddy
    environment:
      - BASE_URL=${BASE_URL}
      - NB_PROXY_DOMAIN=${NB_PROXY_DOMAIN}
      - SSL_EMAIL=${SSL_EMAIL}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    logging: *logging
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data

  netbird-server:
    image: netbirdio/netbird-server:${NETBIRD_SERVER_IMAGE_TAG}
    container_name: netbird-server
    command: ["--config", "/etc/netbird/config.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NB_AUTH_SECRET=${NB_AUTH_SECRET}
      - NB_STORE_ENGINE_POSTGRES_DSN=${NB_STORE_ENGINE_POSTGRES_DSN}
      - NB_STORE_ENCRYPTION_KEY=${NB_STORE_ENCRYPTION_KEY}
      - NB_ACTIVITY_EVENT_STORE_ENGINE=${NB_ACTIVITY_EVENT_STORE_ENGINE}
      - NB_ACTIVITY_EVENT_POSTGRES_DSN=${NB_ACTIVITY_EVENT_POSTGRES_DSN}
    logging: *logging
    networks:
      - netbird-frontend
      - netbird-backend
    ports:
      - "127.0.0.1:8081:80"
      - "3478:3478/udp"
    restart: unless-stopped
    volumes:
      - ./config/netbird/config.yaml:/etc/netbird/config.yaml:ro
      - ./data/netbird:/var/lib/netbird

  netbird-dashboard:
    image: netbirdio/dashboard:${NETBIRD_DASHBOARD_IMAGE_TAG}
    container_name: netbird-dashboard
    environment:
      - NETBIRD_MGMT_API_ENDPOINT=${NETBIRD_MGMT_API_ENDPOINT}
      - NETBIRD_MGMT_GRPC_API_ENDPOINT=${NETBIRD_MGMT_GRPC_API_ENDPOINT}
      - AUTH_AUDIENCE=${AUTH_AUDIENCE}
      - AUTH_CLIENT_ID=${AUTH_CLIENT_ID}
      - AUTH_CLIENT_SECRET=${AUTH_CLIENT_SECRET}
      - AUTH_AUTHORITY=${AUTH_AUTHORITY}
      - USE_AUTH0=${USE_AUTH0}
      - AUTH_SUPPORTED_SCOPES=${AUTH_SUPPORTED_SCOPES}
      - AUTH_REDIRECT_URI=${AUTH_REDIRECT_URI}
      - AUTH_SILENT_REDIRECT_URI=${AUTH_SILENT_REDIRECT_URI}
      - NGINX_SSL_PORT=${NGINX_SSL_PORT}
      - LETSENCRYPT_DOMAIN=${LETSENCRYPT_DOMAIN}
    logging: *logging
    networks:
      - netbird-frontend
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

  netbird-proxy:
    image: netbirdio/reverse-proxy:${NETBIRD_PROXY_IMAGE_TAG}
    container_name: netbird-proxy
    depends_on:
      - caddy
      - netbird-server
    environment:
      - NB_PROXY_MANAGEMENT_ADDRESS=${NB_PROXY_MANAGEMENT_ADDRESS}
      - NB_PROXY_ALLOW_INSECURE=${NB_PROXY_ALLOW_INSECURE}
      - NB_PROXY_DOMAIN=${NB_PROXY_DOMAIN}
      - NB_PROXY_TOKEN=${NB_PROXY_TOKEN}
      - NB_PROXY_ADDRESS=${NB_PROXY_ADDRESS}
      - NB_PROXY_PROXY_PROTOCOL=${NB_PROXY_PROXY_PROTOCOL}
      - NB_PROXY_TRUSTED_PROXIES=${NB_PROXY_TRUSTED_PROXIES}
      - NB_PROXY_FORWARDED_PROTO=${NB_PROXY_FORWARDED_PROTO}
      - NB_PROXY_ACME_CERTIFICATES=${NB_PROXY_ACME_CERTIFICATES}
      - NB_PROXY_ACME_CHALLENGE_TYPE=${NB_PROXY_ACME_CHALLENGE_TYPE}
      - NB_PROXY_CERTIFICATE_DIRECTORY=${NB_PROXY_CERTIFICATE_DIRECTORY}
      - NB_PROXY_WILDCARD_CERT_DIR=${NB_PROXY_WILDCARD_CERT_DIR}
      - NB_PROXY_PRIVATE=${NB_PROXY_PRIVATE}
    logging: *logging
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./data/netbird-proxy/certs:/certs
      - ${CADDY_WILDCARD_DIR}:/certs/wildcard:ro

networks:
  netbird-frontend:
    name: netbird-frontend
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  netbird-backend:
    name: netbird-backend
    driver: bridge
    internal: true

volumes:
  postgres.data:
    name: postgres.data
